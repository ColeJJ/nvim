# LazyGit: geänderte Dateien leichter finden.
#
# Lange Java-Pfade schneidet LazyGit rechts ab; eine reine Dateinamen-Liste
# gibt es nicht. Deshalb Baumansicht (Dateiname als Blatt) und eine breitere
# linke Spalte.
#
# F  → Status-Filter
#      t  nur versionierte (M/A/D)
#      T  nur Untracked (??)
#      r  alles
# `  → volle Pfade als flache Liste
# +  → Files-Fenster weiter vergrößern, _ zurück
# e  → im Diff Datei an der aktuellen Zeile im laufenden Neovim öffnen

os:
  editPreset: nvim-remote

gui:
  showFileTree: true
  sidePanelWidth: 0.52
  nerdFontsVersion: "3"
  showFileIcons: true
  theme:
    # Neovim mappt ANSI-Blau auf #cadee8 — LazyGits Default-Selektion wäre sonst unlesbar.
    selectedLineBgColor:
      - "#082C3C"
    inactiveSelectedLineBgColor:
      - "#05111D"
    selectedRangeBgColor:
      - "#0B364B"
    defaultFgColor:
      - "#c9cccd"
    activeBorderColor:
      - "#e3d363"
      - bold
    inactiveBorderColor:
      - "#08212F"
    optionsTextColor:
      - "#8e97a4"
    searchingActiveBorderColor:
      - "#e3d363"
      - bold
    unstagedChangesColor:
      - "#ff4262"
    cherryPickedCommitFgColor:
      - "#e3d363"
    cherryPickedCommitBgColor:
      - "#0B364B"

keybinding:
  files:
    openStatusFilter: F
